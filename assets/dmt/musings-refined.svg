      .scratch{fill:none;stroke:#28221d;stroke-width:2.2;stroke-linecap:round;opacity:.45}
      .pink{fill:#efa4bb;stroke:#28221d;stroke-width:3.4;stroke-linejoin:round}
      .yellow{fill:#f5d748;stroke:#28221d;stroke-width:3.4;stroke-linejoin:round}
      .blue{fill:#9fd2de;stroke:#28221d;stroke-width:3.4;stroke-linejoin:round}
      .paper{fill:#fff8e9;stroke:#28221d;stroke-width:3.4;stroke-linejoin:round}
      .note{font-family:'Comic Sans MS','Segoe Print',cursive;font-size:24px;font-weight:700;fill:#28221d}
    </style>
  </defs>

