<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" role="img" aria-labelledby="title desc">
  <title id="title">A real decision, not just a good discussion</title>
  <desc id="desc">Discussion bubbles on the left lead through a choice point into a clear checked decision card on the right.</desc>
  <rect width="620" height="360" fill="#fdf6ea"/>

  <g fill="none" stroke="#2b2622" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 116 C64 77 111 48 168 48 C226 48 272 76 272 116 C272 153 230 181 178 184 L145 210 L149 181 C98 174 64 150 64 116 Z" fill="#fff8e9"/>
    <path d="M126 103h77M109 124h100M129 145h59"/>
    <path d="M213 184 C241 193 255 214 255 237 C255 266 224 288 185 288 C149 288 119 270 115 245"/>
    <path d="M112 229 C108 226 106 220 106 214"/>
    <path d="M270 181 C306 181 329 181 359 181"/>
    <path d="M349 163 l21 18 -21 18"/>
    <path d="M375 181 L407 148 L438 181 L407 214 Z" fill="#f5d748"/>
    <path d="M407 214 C433 230 455 239 479 241"/>
    <path d="M407 148 C433 132 454 124 479 121" stroke-dasharray="8 9"/>
    <path d="M477 240 l18 4 -14 12"/>
    <path d="M477 121 l16 -5 -7 -14"/>
  </g>

  <g transform="translate(456 186) rotate(2 65 67)">
    <rect x="0" y="0" width="130" height="134" rx="4" fill="#9fd2de" stroke="#2b2622" stroke-width="4"/>
    <path d="M26 58 l18 20 39 -50" fill="none" stroke="#2b2622" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="104" text-anchor="middle" font-family="Caveat, cursive" font-size="25" font-weight="700" fill="#2b2622">decision</text>
  </g>

  <g transform="translate(470 51) rotate(-3 55 42)">
    <rect x="0" y="0" width="112" height="82" rx="3" fill="#f3a2bb" stroke="#2b2622" stroke-width="3"/>
    <path d="M16 26h64M16 44h79M16 61h49" fill="none" stroke="#2b2622" stroke-width="3" stroke-linecap="round"/>
    <path d="M7 74 L104 8" fill="none" stroke="#2b2622" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="170" y="27" text-anchor="middle" font-family="Caveat, cursive" font-size="24" font-weight="700" fill="#2b2622">good discussion</text>
  <text x="405" y="130" text-anchor="middle" font-family="Caveat, cursive" font-size="22" font-weight="700" fill="#2b2622">choose</text>
</svg>