    <g stroke="#24211d" stroke-width="3" stroke-linecap="round"><path d="M50 82 H142 M50 112 H150 M50 142 H132 M50 172 H145"/></g>
    <rect x="23" y="69" width="18" height="18" fill="#8ecae6"/><rect x="23" y="99" width="18" height="18" fill="#f29bb8"/><rect x="23" y="129" width="18" height="18" fill="#f5cf45"/><rect x="23" y="159" width="18" height="18" fill="#a9d3a0"/>
    <text x="94" y="270" text-anchor="middle" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="29" fill="#24211d">AI summary</text>
    <path d="M35 281 Q94 289 155 280" stroke="#78b7e5" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- story wall -->
  <g transform="translate(1040 205)">
    <path d="M5 20 L212 8 L226 278 L15 290 Z" fill="#fbf4e4" stroke="#24211d" stroke-width="4"/>
    <g fill="#fffdf6" stroke="#24211d" stroke-width="2">
      <rect x="28" y="42" width="55" height="69" transform="rotate(-3 55 76)"/><rect x="95" y="35" width="55" height="70" transform="rotate(4 122 70)"/><rect x="158" y="54" width="48" height="63" transform="rotate(-2 182 85)"/>
      <rect x="36" y="134" width="55" height="70" transform="rotate(2 63 169)"/><rect x="104" y="126" width="55" height="70" transform="rotate(-4 131 161)"/><rect x="163" y="146" width="48" height="63" transform="rotate(3 187 177)"/>
    </g>
    <g stroke="#66605a" stroke-width="2"><path d="M40 58 H71 M40 70 H67 M108 52 H139 M108 64 H136 M170 70 H196 M48 151 H78 M48 164 H76 M116 142 H146 M116 155 H144 M173 160 H199"/></g>
    <rect x="78" y="101" width="24" height="22" fill="#f5cf45" transform="rotate(5 90 112)"/><rect x="146" y="112" width="24" height="22" fill="#8ecae6" transform="rotate(-4 158 123)"/><rect x="86" y="210" width="24" height="22" fill="#f29bb8" transform="rotate(3 98 221)"/>
    <text x="115" y="330" text-anchor="middle" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="28" fill="#24211d">building the</text>
    <text x="115" y="364" text-anchor="middle" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="28" fill="#24211d">day's story</text>
    <path d="M53 376 Q115 385 180 374" stroke="#f0b52d" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- arrows -->
  <g stroke="#24211d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 430 H304 M294 420 L306 430 L294 440"/>
    <path d="M528 430 H567 M557 420 L569 430 L557 440"/>
    <path d="M800 430 H830 M820 420 L832 430 L820 440"/>
    <path d="M1018 430 H1038 M1028 420 L1040 430 L1028 440"/>
