<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">Record with intention. Build the story together.</title>
  <desc id="d">Hand-drawn workshop sequence showing plenary recording on, breakout recording off, sharebacks recording on, an AI summary, and a wall building the day's story.</desc>
  <rect width="1280" height="720" fill="#fff8e9"/>
  <g fill="none" stroke="#24211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M355 169 Q500 153 650 164" opacity=".45"/>
    <path d="M470 175 Q598 185 721 169" opacity=".35"/>
  </g>
  <g font-family="Comic Sans MS, Bradley Hand, cursive" fill="#211e1a">
    <text x="640" y="76" text-anchor="middle" font-size="50" font-weight="700">Record with intention.</text>
    <text x="640" y="133" text-anchor="middle" font-size="49" font-weight="700">Build the story together.</text>
  </g>
  <path d="M454 145 Q640 166 826 145" stroke="#24211d" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- plenary -->
  <g transform="translate(55 200)">
    <rect x="8" y="0" width="120" height="38" rx="9" fill="#fff8e9" stroke="#24211d" stroke-width="4"/>
    <circle cx="25" cy="19" r="8" fill="#ef5753" stroke="#24211d" stroke-width="2"/>
    <text x="41" y="26" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24211d">REC ON</text>
    <g stroke="#24211d" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="82" cy="104" r="22"/><path d="M52 165 Q82 125 112 165"/><path d="M61 168 L58 228 M103 168 L107 228"/>
      <path d="M113 147 Q145 136 163 116"/>
      <rect x="155" y="80" width="90" height="115" rx="3"/>
      <path d="M166 100 H220 M166 118 H210 M166 142 H230" stroke-width="3"/>
      <circle cx="33" cy="218" r="18"/><circle cx="86" cy="222" r="18"/><circle cx="138" cy="220" r="18"/>
      <path d="M12 267 Q33 235 54 267 M65 271 Q86 239 107 271 M117 269 Q138 237 159 269"/>
    </g>
    <rect x="176" y="154" width="16" height="16" fill="#f5cf45" transform="rotate(-4 184 162)"/><rect x="199" y="150" width="16" height="16" fill="#f29bb8" transform="rotate(5 207 158)"/>
    <text x="120" y="324" text-anchor="middle" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="29" fill="#24211d">plenary</text>
    <path d="M72 335 Q120 344 168 334" stroke="#ef7d88" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- breakout -->
  <g transform="translate(310 200)">
    <rect x="35" y="0" width="128" height="38" rx="9" fill="#fff8e9" stroke="#24211d" stroke-width="4"/>
    <circle cx="54" cy="19" r="8" fill="#24211d"/>
    <text x="69" y="26" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24211d">REC OFF</text>
    <g stroke="#24211d" stroke-width="4" fill="none" stroke-linecap="round">
      <ellipse cx="100" cy="205" rx="82" ry="35"/>
      <circle cx="55" cy="130" r="18"/><circle cx="96" cy="118" r="18"/><circle cx="145" cy="132" r="18"/><circle cx="106" cy="166" r="18"/>
      <path d="M37 175 Q55 145 73 175 M78 163 Q96 135 114 163 M127 177 Q145 148 163 177 M88 209 Q106 181 124 209"/>
    </g>
    <rect x="80" y="192" width="17" height="15" fill="#8ecae6" transform="rotate(-6 88 199)"/><rect x="112" y="204" width="17" height="15" fill="#f5cf45" transform="rotate(4 120 211)"/>
    <text x="100" y="324" text-anchor="middle" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="29" fill="#24211d">breakouts</text>
    <path d="M45 335 Q100 345 158 334" stroke="#78b7e5" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- sharebacks -->
  <g transform="translate(575 200)">
    <rect x="30" y="0" width="120" height="38" rx="9" fill="#fff8e9" stroke="#24211d" stroke-width="4"/>
    <circle cx="48" cy="19" r="8" fill="#ef5753" stroke="#24211d" stroke-width="2"/>
    <text x="64" y="26" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24211d">REC ON</text>
    <g stroke="#24211d" stroke-width="4" fill="none" stroke-linecap="round">
