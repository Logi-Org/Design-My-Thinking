    <rect x="167" y="157" width="18" height="17" fill="#f5cf45" transform="rotate(-5 176 165)"/>
    <text x="110" y="324" text-anchor="middle" font-family="Comic Sans MS, Bradley Hand, cursive" font-size="29" fill="#24211d">sharebacks</text>
    <path d="M45 335 Q110 345 180 334" stroke="#ef7d88" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- AI summary -->
  <g transform="translate(835 255)">
