      <path d="M122 153 Q154 144 174 124"/>
      <rect x="150" y="86" width="92" height="118" rx="3"/>
      <path d="M162 105 H218 M162 125 H230 M162 150 H220" stroke-width="3"/>
      <circle cx="28" cy="225" r="17"/><circle cx="75" cy="235" r="17"/><circle cx="126" cy="229" r="17"/><circle cx="175" cy="232" r="17"/>
      <path d="M8 270 Q28 241 48 270 M55 280 Q75 251 95 280 M106 275 Q126 246 146 275 M155 278 Q175 249 195 278"/>
