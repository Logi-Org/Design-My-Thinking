name: Verify Musings live

on:
  push:
    branches: [main]
    paths:
      - 'musings-refined.css'
      - 'musings-transparent-art.css'
      - 'musings-transparent-art.js'
      - 'musings.html'
      - 'assets/dmt/musings-approved-*.webp'
      - 'assets/dmt/musing-06-let-the-workshop-remember.jpg'
      - '.github/workflows/verify-musings-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the Musings revision to reach GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 24); do
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/musings.html?verify=${GITHUB_SHA}-${i}" -o live-musings.html || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/musings-transparent-art.css?v=20260817a&verify=${GITHUB_SHA}-${i}" -o live-transparent.css || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/musings-transparent-art.js?v=20260817a&verify=${GITHUB_SHA}-${i}" -o live-transparent.js || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/musing-06-let-the-workshop-remember.jpg?verify=${GITHUB_SHA}-${i}" -o live-musing-06.jpg || true
            if grep -q "musings-transparent-art.css?v=20260817a" live-musings.html 2>/dev/null && \
               grep -q "musings-transparent-art.js?v=20260817a" live-musings.html 2>/dev/null && \
               grep -q "Let the approved Musings drawings sit directly" live-transparent.css 2>/dev/null && \
               grep -q "transparentDataURL" live-transparent.js 2>/dev/null && \
               grep -q "musing-06-let-the-workshop-remember.jpg" live-transparent.js 2>/dev/null && \
               cmp -s "assets/dmt/musing-06-let-the-workshop-remember.jpg" live-musing-06.jpg 2>/dev/null; then
              found=1
              break
            fi
            sleep 15
          done
          test "$found" = "1"

      - name: Verify the live page and exact approved image bytes
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Scenarios stretch thinking" live-musings.html
          grep -q "Seed the question, not the answer" live-musings.html
          grep -q "The value of a canvas" live-musings.html
          grep -q "When Post-its become wallpaper" live-musings.html

          for name in scenarios seed canvas wallpaper; do
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/musings-approved-${name}.webp?verify=${GITHUB_SHA}" -o "live-${name}.webp"
            cmp "assets/dmt/musings-approved-${name}.webp" "live-${name}.webp"
          done

          cmp "assets/dmt/musing-06-let-the-workshop-remember.jpg" live-musing-06.jpg
          file live-musing-06.jpg | grep -qi 'JPEG image data'
          test "$(wc -c < live-musing-06.jpg)" -gt 10000

      - name: Capture the actual live Musings page on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,1800 \
            --virtual-time-budget=5000 \
            --screenshot=musings-desktop-live.png \
            "https://designmythinking.xyz/musings.html?verify=${GITHUB_SHA}"
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=412,4200 \
            --force-device-scale-factor=1 \
            --virtual-time-budget=5000 \
            --screenshot=musings-mobile-live.png \
            "https://designmythinking.xyz/musings.html?verify=${GITHUB_SHA}"
          test -s musings-desktop-live.png
          test -s musings-mobile-live.png

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: musings-transparent-live-verification
          path: |
            musings-desktop-live.png
            musings-mobile-live.png
            live-transparent.css
            live-transparent.js
            live-scenarios.webp
            live-seed.webp
            live-canvas.webp
            live-wallpaper.webp
            live-musing-06.jpg
          retention-days: 7
