name: Materialize approved inner-page assets v2

on:
  push:
    branches: [main]
    paths:
      - '.asset-transfer/trigger-v2.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode homepage AI artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/dmt
          cat .asset-transfer/ai-small-*.txt | tr -d '\n\r\t ' | base64 -d > assets/dmt/ai-levels-handdrawn.webp
          file assets/dmt/ai-levels-handdrawn.webp
          test "$(stat -c%s assets/dmt/ai-levels-handdrawn.webp)" -gt 15000

      - name: Commit binary asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189825+github-actions[bot]@users.noreply.github.com'
          git add assets/dmt/ai-levels-handdrawn.webp
          if git diff --cached --quiet; then
            echo 'Asset already current.'
            exit 0
          fi
          git commit -m 'Add approved homepage AI artwork'
          git push
