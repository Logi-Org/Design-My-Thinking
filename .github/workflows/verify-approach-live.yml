name: Verify Approach page live

on:
  push:
    branches: [main]
    paths:
      - 'approach.html'
      - 'approach-approved.css'
      - 'approach-approved-art.js'
      - 'approach-layout-fix-20260821b.css'
      - 'approach-hero-clean-20260821b.js'
      - '.github/workflows/verify-approach-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live Approach revision
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            echo "Live check attempt ${attempt}/24"
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/approach.html?verify=${GITHUB_SHA}" -o approach-live.html || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/approach-layout-fix-20260821b.css?v=20260821c&verify=${GITHUB_SHA}" -o approach-live-fix.css || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/approach-hero-clean-20260821b.js?v=20260821c&verify=${GITHUB_SHA}" -o approach-live-selected.js || true
            if grep -q 'approach-layout-fix-20260821b.css?v=20260821c' approach-live.html 2>/dev/null \
              && grep -q 'approach-hero-clean-20260821b.js?v=20260821c' approach-live.html 2>/dev/null \
              && grep -q 'selected mock-up implementation' approach-live-fix.css 2>/dev/null \
              && grep -q 'function drawHero(host)' approach-live-selected.js 2>/dev/null \
              && grep -q 'function drawAfter(host)' approach-live-selected.js 2>/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Selected Approach revision did not reach live domain in time.'
            exit 1
          fi
      - name: Capture live desktop and mobile Approach views
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,5200 \
            --screenshot=approach-desktop-live.png \
            "https://designmythinking.xyz/approach.html?verify=${GITHUB_SHA}"
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=412,5600 \
            --force-device-scale-factor=1 \
            --screenshot=approach-mobile-live.png \
            "https://designmythinking.xyz/approach.html?verify=${GITHUB_SHA}"
          test -s approach-desktop-live.png
          test -s approach-mobile-live.png
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: approach-selected-sections-live
          path: 'approach-*-live.png'
          retention-days: 7
