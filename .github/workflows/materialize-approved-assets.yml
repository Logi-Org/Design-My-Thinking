name: Materialize approved inner-page assets

on:
  push:
    branches: [main]
    paths:
      - '.asset-transfer/trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode approved sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/dmt
          cat .asset-transfer/approach-*.txt | tr -d '\n\r ' | base64 -d > assets/dmt/approved-approach-sprite.webp
          cat .asset-transfer/secondary-*.txt | tr -d '\n\r ' | base64 -d > assets/dmt/approved-secondary-sprite.webp
          echo '0df81f3c9e929d5c4828e5a99dec764dee568c81aecb84e02bdd08bb615e4001  assets/dmt/approved-approach-sprite.webp' | sha256sum -c -
          echo '459bb52e0da641e38a5b0c640a7ca50f9a0e9c8a09b94c746a06eab512d0501f  assets/dmt/approved-secondary-sprite.webp' | sha256sum -c -

      - name: Commit binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dmt/approved-approach-sprite.webp assets/dmt/approved-secondary-sprite.webp
          if git diff --cached --quiet; then
            echo 'Assets already current.'
            exit 0
          fi
          git commit -m 'Add approved inner-page artwork sprites'
          git push
