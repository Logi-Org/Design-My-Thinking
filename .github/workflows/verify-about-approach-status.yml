name: Verify About and Approach live status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-about-approach-status.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for polished pages to reach live site
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            echo "Live check attempt ${attempt}/36"
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/about.html?verify=${GITHUB_SHA}" -o about-live.html || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/approach.html?verify=${GITHUB_SHA}" -o approach-live.html || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/about-refined.css?v=20260821a&verify=${GITHUB_SHA}" -o about-live.css || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/approach-approved.css?v=20260821a&verify=${GITHUB_SHA}" -o approach-live.css || true
            if grep -q 'about-refined.css?v=20260821a' about-live.html 2>/dev/null \
              && grep -q 'content:"actual human"' about-live.css 2>/dev/null \
              && grep -q 'approach-approved.css?v=20260821a' approach-live.html 2>/dev/null \
              && grep -q 'grid-auto-rows:1fr' approach-live.css 2>/dev/null \
              && grep -q 'From energy in' approach-live.css 2>/dev/null \
              && grep -q 'padding-left:14px' approach-live.css 2>/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo 'Polish did not reach live site.'; exit 1; }
          mkdir -p verification
          {
            echo 'status=success'
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'about_css=20260821a'
            echo 'about_actual_human=present'
            echo 'approach_css=20260821a'
            echo 'approach_cards_equal_height=present'
            echo 'approach_after_art_large_captions=present'
            echo 'approach_mobile_copy_nudge=present'
          } > verification/about-approach-polish-status.txt
      - name: Commit verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/about-approach-polish-status.txt
          git commit -m 'Record live About and Approach polish verification'
          git push
