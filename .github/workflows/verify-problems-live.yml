name: Verify approved problems live

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-problems-exact.js'
      - 'assets/dmt/problem-exact/**'
      - '.github/workflows/verify-problems-live.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure homepage references current problem artwork
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'home-problems-exact.js?v=20260821problems4' index.html
          grep -q "VERSION='20260821problems4'" home-problems-exact.js
          grep -q 'remove its faint baked-in paper colour' home-problems-exact.js

      - name: Wait for current problem treatment on live deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 35); do
            echo "Live verification attempt ${attempt}/35"
            rm -f home-live.html problems-live.js p1.webp p2.webp p3.webp p4.webp p5.webp
            if curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}&attempt=${attempt}" -o home-live.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/home-problems-exact.js?v=20260821problems4&verify=${GITHUB_SHA}&attempt=${attempt}" -o problems-live.js \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/problem-exact/p1.webp?v=20260821problems4&verify=${GITHUB_SHA}&attempt=${attempt}" -o p1.webp \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/problem-exact/p2.webp?v=20260821problems4&verify=${GITHUB_SHA}&attempt=${attempt}" -o p2.webp \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/problem-exact/p3.webp?v=20260821problems4&verify=${GITHUB_SHA}&attempt=${attempt}" -o p3.webp \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/problem-exact/p4.webp?v=20260821problems4&verify=${GITHUB_SHA}&attempt=${attempt}" -o p4.webp \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/problem-exact/p5.webp?v=20260821problems4&verify=${GITHUB_SHA}&attempt=${attempt}" -o p5.webp \
              && grep -q 'home-problems-exact.js?v=20260821problems4' home-live.html \
              && grep -q "VERSION='20260821problems4'" problems-live.js \
              && grep -q 'problem-exact-canvas' problems-live.js \
              && test "$(wc -c < p1.webp)" -gt 3000 \
              && test "$(wc -c < p2.webp)" -gt 5000 \
              && test "$(wc -c < p3.webp)" -gt 5000 \
              && test "$(wc -c < p4.webp)" -gt 10000 \
              && test "$(wc -c < p5.webp)" -gt 5000; then
              ok=1
              break
            fi
            sleep 12
          done
          test "$ok" -eq 1

      - name: Verify and capture all five live mobile problem cards
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium pillow
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          URL='https://designmythinking.xyz/index.html?visual-check=20260821problems4#problems'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--hide-scrollbars')
          opts.add_argument('--window-size=412,1050')
          driver=webdriver.Chrome(options=opts)
          try:
              driver.set_window_size(412,1050)
              driver.get(URL)
              wait=WebDriverWait(driver,30)
              section=wait.until(lambda d:d.find_element(By.ID,'problems'))
              next_button=section.find_element(By.CSS_SELECTOR,'.dmt-slider__button--next')
              counter=section.find_element(By.CSS_SELECTOR,'.dmt-slider__counter')
              cards=section.find_elements(By.CSS_SELECTOR,'.problem-note')
              assert len(cards)==5, len(cards)
              for i in range(1,6):
                  expected=f'{i} / 5'
                  wait.until(lambda d:counter.text.strip()==expected)
                  slide=cards[i-1]
                  canvas=wait.until(lambda d:slide.find_element(By.CSS_SELECTOR,'canvas.problem-exact-canvas'))
                  wait.until(lambda d:d.execute_script('return arguments[0].width > 100 && arguments[0].height > 80',canvas))
                  assert canvas.get_attribute('data-problem-exact')==str(i)
                  assert canvas.get_attribute('data-problem-version')=='20260821problems4'
                  alpha=driver.execute_script("return arguments[0].getContext('2d').getImageData(0,0,1,1).data[3]",canvas)
                  assert alpha < 40, alpha
                  host=slide.find_element(By.CSS_SELECTOR,'.problem-art')
                  assert float(host.value_of_css_property('height').replace('px','')) >= 190
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'});",section)
                  time.sleep(.5)
                  section.screenshot(f'problem-mobile-{i}.png')
                  print(expected, canvas.get_attribute('width'), canvas.get_attribute('height'), 'corner-alpha', alpha)
                  if i<5:
                      driver.execute_script('arguments[0].click()',next_button)
                      time.sleep(.7)
          finally:
              driver.quit()
          PY
          ls -lh problem-mobile-*.png

      - name: Capture live desktop problem carousel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--hide-scrollbars')
          opts.add_argument('--window-size=1440,1000')
          d=webdriver.Chrome(options=opts)
          try:
              d.set_window_size(1440,1000)
              d.get('https://designmythinking.xyz/index.html?visual-check=20260821problems4#problems')
              section=WebDriverWait(d,30).until(lambda x:x.find_element(By.ID,'problems'))
              WebDriverWait(d,30).until(lambda x:len(section.find_elements(By.CSS_SELECTOR,'canvas.problem-exact-canvas'))==5)
              d.execute_script("arguments[0].scrollIntoView({block:'center'});",section)
              time.sleep(.8)
              section.screenshot('problems-desktop.png')
          finally:
              d.quit()
          PY

      - name: Build compact verification contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path

          desktop=Image.open('problems-desktop.png').convert('RGB')
          desktop.thumbnail((1100,760))
          mobiles=[]
          for i in range(1,6):
              im=Image.open(f'problem-mobile-{i}.png').convert('RGB')
              im.thumbnail((300,760))
              mobiles.append(im)
          gap=20
          top_h=desktop.height
          mobile_h=max(im.height for im in mobiles)
          width=max(desktop.width, sum(im.width for im in mobiles)+gap*(len(mobiles)-1))
          sheet=Image.new('RGB',(width,top_h+gap+mobile_h),(246,242,233))
          sheet.paste(desktop,((width-desktop.width)//2,0))
          x=(width-(sum(im.width for im in mobiles)+gap*(len(mobiles)-1)))//2
          for im in mobiles:
              sheet.paste(im,(x,top_h+gap))
              x+=im.width+gap
          sheet.save('problems-verification-contact-sheet.jpg',quality=72,optimize=True)
          PY
          mkdir -p verification
          base64 -w0 problems-verification-contact-sheet.jpg > verification/problems-live-contact-sheet.b64
          printf 'verified_sha=%s\nversion=20260821problems4\n' "$GITHUB_SHA" > verification/problems-live-status.txt

      - name: Persist verification result for inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verification/problems-live-contact-sheet.b64 verification/problems-live-status.txt
          git commit -m "Record problem carousel live verification ${GITHUB_SHA}" || exit 0
          git pull --rebase origin main
          git push

      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: approved-problems-live-verification
          path: |
            problem-mobile-*.png
            problems-desktop.png
            problems-verification-contact-sheet.jpg
          retention-days: 7
