name: Actions storage audit
on:
  pull_request:
    paths: ['.github/workflows/actions-storage-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page: 100});
            const live = artifacts.filter(a => !a.expired);
            const groups = {};
            for (const a of live) {
              const g = groups[a.name] ||= {count: 0, bytes: 0};
              g.count++; g.bytes += a.size_in_bytes;
            }
            console.log('STORAGE_TOTAL ' + JSON.stringify({repo: process.env.GITHUB_REPOSITORY, count: live.length, bytes: live.reduce((s,a)=>s+a.size_in_bytes,0)}));
            for (const [name, g] of Object.entries(groups).sort((a,b)=>b[1].bytes-a[1].bytes)) console.log('STORAGE_GROUP ' + JSON.stringify({name,...g}));
            for (const a of live.sort((a,b)=>b.size_in_bytes-a.size_in_bytes)) console.log('STORAGE_ARTIFACT ' + JSON.stringify({id:a.id,name:a.name,bytes:a.size_in_bytes,created_at:a.created_at,expires_at:a.expires_at,run_id:a.workflow_run?.id}));
            const cache = await github.rest.actions.getActionsCacheUsage({...context.repo});
            console.log('CACHE_USAGE ' + JSON.stringify(cache.data));
