name: Refresh Musing 06 client asset

on:
  push:
    branches: [main]
    paths:
      - 'refresh-musing06-client.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Musing 06 under a fresh uncached filename
        shell: bash
        run: |
          set -euo pipefail
          cp assets/dmt/musing-06-let-the-workshop-remember.jpg assets/dmt/musing-06-workshop-memory-v2.jpg
          file assets/dmt/musing-06-workshop-memory-v2.jpg | grep -qi 'JPEG image data'
          test "$(wc -c < assets/dmt/musing-06-workshop-memory-v2.jpg)" -gt 40000

      - name: Point Musings to the fresh image and JavaScript URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js = Path('musings-transparent-art.js')
          text = js.read_text()
          old_image = 'musing-06-let-the-workshop-remember.jpg'
          new_image = 'musing-06-workshop-memory-v2.jpg'
          if old_image not in text and new_image not in text:
              raise SystemExit('Could not find Musing 06 image reference in JavaScript')
          js.write_text(text.replace(old_image, new_image).replace('v=20260826b', 'v=20260826e'))

          html = Path('musings.html')
          text = html.read_text()
          old_script = 'musings-transparent-art.js?v=20260817a'
          new_script = 'musings-transparent-art.js?v=20260826e'
          if old_script not in text and new_script not in text:
              raise SystemExit('Could not find Musings artwork JavaScript reference in HTML')
          html.write_text(text.replace(old_script, new_script))
          PY
          grep -q 'musing-06-workshop-memory-v2.jpg?v=20260826e' musings-transparent-art.js
          grep -q 'musings-transparent-art.js?v=20260826e' musings.html

      - name: Commit fresh Musing 06 asset references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dmt/musing-06-workshop-memory-v2.jpg musings-transparent-art.js musings.html
          if git diff --cached --quiet; then
            echo "Musing 06 client asset already refreshed."
            exit 0
          fi
          git commit -m "Publish Musing 06 artwork at fresh asset URL"
          git push
