name: Verify homepage tweaks live

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-refined-art.css'
      - 'home-refined-art.js'
      - 'assets/dmt/glimpse-priorities-decision.svg'
      - 'assets/dmt/problem-decision-over-discussion.svg'
      - '.github/workflows/verify-home-tweaks-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          url="https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 12); do
            echo "Live check attempt ${attempt}/12"
            curl -fsSL -H 'Cache-Control: no-cache' "$url" -o home-live.html || true
            curl -fsSL "https://designmythinking.xyz/assets/dmt/glimpse-priorities-decision.svg?verify=${GITHUB_SHA}" -o priorities.svg || true
            curl -fsSL "https://designmythinking.xyz/assets/dmt/problem-decision-over-discussion.svg?verify=${GITHUB_SHA}" -o decision.svg || true
            if grep -q 'Reimagining professional services with AI' home-live.html 2>/dev/null \
              && grep -q 'hero-blue-note-fix' home-live.html 2>/dev/null \
              && grep -q 'Competing priorities converging into one decision' priorities.svg 2>/dev/null \
              && grep -q 'A real decision, not just a good discussion' decision.svg 2>/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Expected live homepage revision was not visible after retries.'
            echo '--- homepage markers ---'
            grep -E 'Reimagining (legal|professional) services|hero-blue-note-fix' home-live.html || true
            echo '--- priorities title ---'
            grep -E '<title|<desc' priorities.svg || true
            echo '--- decision title ---'
            grep -E '<title|<desc' decision.svg || true
            exit 1
          fi
      - name: Capture live homepage views
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,900 \
            --screenshot=home-hero-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,900 \
            --screenshot=home-glimpses-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}#glimpses"
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,900 \
            --screenshot=home-problems-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}#problems"
          test -s home-hero-live.png
          test -s home-glimpses-live.png
          test -s home-problems-live.png
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-tweaks-live-verification
          path: 'home-*-live.png'
          retention-days: 7
