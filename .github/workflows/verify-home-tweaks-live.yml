name: Verify homepage tweaks live

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-refined-art.css'
      - 'home-refined-art.js'
      - '.github/workflows/verify-home-tweaks-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages and verify current revision
        shell: bash
        run: |
          set -euo pipefail
          url="https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 15); do
            echo "Live check attempt ${attempt}/15"
            curl -fsSL -H 'Cache-Control: no-cache' "$url" -o home-live.html || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/home-refined-art.js?v=20260817a&verify=${GITHUB_SHA}" -o refined-live.js || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/home-refined-art.css?v=20260817a&verify=${GITHUB_SHA}" -o refined-live.css || true
            html_ok=0
            js_ok=0
            css_ok=0
            if grep -q 'home-refined-art.css?v=20260817a' home-live.html 2>/dev/null \
              && grep -q 'home-refined-art.js?v=20260817a' home-live.html 2>/dev/null; then
              html_ok=1
            fi
            if grep -q 'drawPriorities' refined-live.js 2>/dev/null \
              && grep -q 'drawDecision' refined-live.js 2>/dev/null \
              && grep -q 'handdrawn-canvas' refined-live.js 2>/dev/null; then
              js_ok=1
            fi
            if grep -q 'hero-blue-note-fix' refined-live.css 2>/dev/null \
              && grep -q 'choose\\A what\\A matters' refined-live.css 2>/dev/null \
              && grep -q 'handdrawn-canvas' refined-live.css 2>/dev/null; then
              css_ok=1
            fi
            if [ "$html_ok" -eq 1 ] && [ "$js_ok" -eq 1 ] && [ "$css_ok" -eq 1 ]; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Expected mobile hand-drawn homepage revision was not visible after retries.'
            grep -E 'home-refined-art\.(css|js)' home-live.html || true
            exit 1
          fi
      - name: Capture live desktop and mobile homepage views
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,3600 \
            --screenshot=home-desktop-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=412,3000 \
            --force-device-scale-factor=1 \
            --screenshot=home-mobile-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          test -s home-desktop-live.png
          test -s home-mobile-live.png
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-mobile-fix-live-verification
          path: 'home-*-live.png'
          retention-days: 7
