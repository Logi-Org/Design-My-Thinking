name: Verify homepage tweaks live

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-ai-levels.js'
      - 'assets/dmt/ai-levels-handdrawn-transparent.webp'
      - '.github/workflows/verify-home-tweaks-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for transparent hand-drawn AI artwork to be live
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          ok=0
          for attempt in $(seq 1 24); do
            echo "Live verification attempt ${attempt}/24"
            rm -f home-live.html ai-live.js ai-live.webp
            if curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}&attempt=${attempt}" -o home-live.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/home-ai-levels.js?v=20260818c&verify=${GITHUB_SHA}&attempt=${attempt}" -o ai-live.js \
              && curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/ai-levels-handdrawn-transparent.webp?v=20260818c&verify=${GITHUB_SHA}&attempt=${attempt}" -o ai-live.webp \
              && grep -q 'home-ai-levels.js?v=20260818c' home-live.html \
              && grep -q 'ai-levels-handdrawn-transparent.webp?v=20260818c' ai-live.js \
              && grep -q 'art-problem-05' ai-live.js \
              && test "$(stat -c%s ai-live.webp)" -gt 10000; then
              if python - <<'PY'
          from PIL import Image
          try:
              im=Image.open('ai-live.webp')
              im.load()
              assert im.mode == 'RGBA', f'Expected RGBA transparency, got {im.mode}'
              alpha=im.getchannel('A')
              lo,hi=alpha.getextrema()
              assert lo == 0, f'Expected fully transparent background pixels, alpha min={lo}'
              assert hi > 200, f'Artwork unexpectedly faint, alpha max={hi}'
              print('Transparent artwork verified:', im.size, im.mode, (lo,hi))
          except Exception as exc:
              print('Artwork not ready yet:', exc)
              raise SystemExit(1)
          PY
              then
                file ai-live.webp
                ok=1
                break
              fi
            fi
            sleep 15
          done
          test "$ok" -eq 1

      - name: Capture live desktop and mobile card through real slider navigation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          URL = 'https://designmythinking.xyz/index.html?visual-check=20260818c#problems'

          def capture(width, height, clicks, expected_counter, path):
              opts = Options()
              opts.add_argument('--headless=new')
              opts.add_argument('--no-sandbox')
              opts.add_argument('--disable-gpu')
              opts.add_argument('--hide-scrollbars')
              opts.add_argument(f'--window-size={width},{height}')
              driver = webdriver.Chrome(options=opts)
              try:
                  driver.set_window_size(width, height)
                  driver.get(URL)
                  wait = WebDriverWait(driver, 20)
                  section = wait.until(lambda d: d.find_element(By.ID, 'problems'))
                  next_button = section.find_element(By.CSS_SELECTOR, '.dmt-slider__button--next')
                  counter = section.find_element(By.CSS_SELECTOR, '.dmt-slider__counter')
                  for _ in range(clicks):
                      wait.until(lambda d: next_button.is_enabled())
                      driver.execute_script('arguments[0].click()', next_button)
                      time.sleep(0.55)
                  wait.until(lambda d: counter.text.strip() == expected_counter)
                  img = section.find_element(By.CSS_SELECTOR, '.art-problem-05 img.ai-levels-handdrawn')
                  wait.until(lambda d: d.execute_script('return arguments[0].complete && arguments[0].naturalWidth > 0', img))
                  assert img.is_displayed(), 'AI artwork image is not displayed'
                  assert 'ai-levels-handdrawn-transparent.webp?v=20260818c' in img.get_attribute('src')
                  driver.execute_script("arguments[0].scrollIntoView({block:'center', inline:'nearest'});", section)
                  time.sleep(0.8)
                  section.screenshot(path)
                  print(f'{path}: {counter.text}; image={img.size}; src={img.get_attribute("src")}')
              finally:
                  driver.quit()

          capture(1440, 1100, 1, '2 / 2', 'home-desktop-live.png')
          capture(412, 1000, 4, '5 / 5', 'home-mobile-live.png')
          PY
          test -s home-desktop-live.png
          test -s home-mobile-live.png

      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-ai-levels-transparent-live-verification
          path: 'home-*-live.png'
          retention-days: 7
