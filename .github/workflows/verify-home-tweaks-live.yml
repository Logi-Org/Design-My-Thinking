name: Verify homepage tweaks live

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-ai-levels.js'
      - '.github/workflows/verify-home-tweaks-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify AI transformation sketch is live
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}" -o home-live.html
          curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/home-ai-levels.js?v=20260817b&verify=${GITHUB_SHA}" -o ai-live.js
          grep -q 'home-ai-levels.js?v=20260817b' home-live.html
          grep -q 'art-problem-05' ai-live.js
          grep -q 'verify-ai' ai-live.js
          grep -q 'Task' ai-live.js
          grep -q 'Workflow' ai-live.js
          grep -q 'Function' ai-live.js
          grep -q 'Company' ai-live.js
      - name: Capture live desktop and mobile AI problem card
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,3600 \
            --virtual-time-budget=3000 \
            --screenshot=home-desktop-live.png \
            "https://designmythinking.xyz/index.html?verify-ai=1&verify=${GITHUB_SHA}#problems"
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=412,4200 \
            --force-device-scale-factor=1 \
            --virtual-time-budget=3000 \
            --screenshot=home-mobile-live.png \
            "https://designmythinking.xyz/index.html?verify-ai=1&verify=${GITHUB_SHA}#problems"
          test -s home-desktop-live.png
          test -s home-mobile-live.png
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-ai-levels-live-verification
          path: 'home-*-live.png'
          retention-days: 7
