name: Verify homepage tweaks live

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-refined-art.css'
      - 'home-refined-art.js'
      - 'assets/dmt/glimpse-priorities-handdrawn.webp'
      - 'assets/dmt/problem-decision-handdrawn.webp'
      - 'assets/dmt/hero-blue-note-handdrawn.webp'
      - '.github/workflows/verify-home-tweaks-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages and verify exact assets
        shell: bash
        run: |
          set -euo pipefail
          url="https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 12); do
            echo "Live check attempt ${attempt}/12"
            curl -fsSL -H 'Cache-Control: no-cache' "$url" -o home-live.html || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/glimpse-priorities-handdrawn.webp?verify=${GITHUB_SHA}" -o priorities.webp || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/problem-decision-handdrawn.webp?verify=${GITHUB_SHA}" -o decision.webp || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/assets/dmt/hero-blue-note-handdrawn.webp?verify=${GITHUB_SHA}" -o blue-note.webp || true
            html_ok=0
            assets_ok=0
            if grep -q 'Reimagining professional services with AI' home-live.html 2>/dev/null \
              && grep -q 'home-refined-art.css?v=20260816b' home-live.html 2>/dev/null \
              && grep -q 'home-refined-art.js?v=20260816b' home-live.html 2>/dev/null; then
              html_ok=1
            fi
            if echo '6063bc1b7438d20bec01eeff446b19f1dcd0b8b4f5ddedcc4de04a7789d48bd8  priorities.webp' | sha256sum -c - >/dev/null 2>&1 \
              && echo 'cb0abe6716df100f86ed433aaafd0b5ab70f3febb12aabed7786ef847e08880a  decision.webp' | sha256sum -c - >/dev/null 2>&1 \
              && echo 'd295ea57789c8db22e9b8937b1e0af2b8bc94eca23ac71beadcab3fe750045e2  blue-note.webp' | sha256sum -c - >/dev/null 2>&1; then
              assets_ok=1
            fi
            if [ "$html_ok" -eq 1 ] && [ "$assets_ok" -eq 1 ]; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Expected hand-drawn homepage revision was not visible after retries.'
            grep -E 'Reimagining professional services|home-refined-art\.(css|js)' home-live.html || true
            sha256sum priorities.webp decision.webp blue-note.webp 2>/dev/null || true
            exit 1
          fi
      - name: Capture live homepage views
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,900 \
            --screenshot=home-hero-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,3600 \
            --screenshot=home-full-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          test -s home-hero-live.png
          test -s home-full-live.png
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-tweaks-live-verification
          path: 'home-*-live.png'
          retention-days: 7
