name: Verify homepage tweaks live

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-sketch-fix.css'
      - 'home-sketch-fix.js'
      - 'home-ai-levels.js'
      - '.github/workflows/verify-home-tweaks-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages and verify cache-safe files
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            echo "Live check attempt ${attempt}/24"
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}" -o home-live.html || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/home-sketch-fix.js?verify=${GITHUB_SHA}" -o sketch-live.js || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/home-sketch-fix.css?verify=${GITHUB_SHA}" -o sketch-live.css || true
            curl -fsSL -H 'Cache-Control: no-cache' "https://designmythinking.xyz/home-ai-levels.js?v=20260817a&verify=${GITHUB_SHA}" -o ai-live.js || true
            if grep -q 'home-ai-levels.js?v=20260817a' home-live.html 2>/dev/null \
              && grep -q 'art-problem-05' ai-live.js 2>/dev/null \
              && grep -q 'Task' ai-live.js 2>/dev/null \
              && grep -q 'Workflow' ai-live.js 2>/dev/null \
              && grep -q 'Function' ai-live.js 2>/dev/null \
              && grep -q 'Company' ai-live.js 2>/dev/null \
              && grep -q 'hero-blue-note-fix' sketch-live.css 2>/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo 'Homepage AI transformation sketch did not reach live site.'; exit 1; }
      - name: Capture live desktop and mobile homepage views
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,5200 \
            --screenshot=home-desktop-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=412,5200 \
            --force-device-scale-factor=1 \
            --screenshot=home-mobile-live.png \
            "https://designmythinking.xyz/index.html?verify=${GITHUB_SHA}"
          test -s home-desktop-live.png
          test -s home-mobile-live.png
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-ai-levels-live-verification
          path: 'home-*-live.png'
          retention-days: 7
