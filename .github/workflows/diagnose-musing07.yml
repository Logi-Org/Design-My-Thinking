name: Diagnose Musing 07 route

on:
  push:
    branches: [main]
    paths: ['diagnose-musing07.trigger']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture direct route diagnostics
        shell: bash
        run: |
          set -u
          curl -sSL -D direct-headers.txt -H 'Cache-Control: no-cache' "https://designmythinking.xyz/musings/read-less-hear-more/?diag=${GITHUB_SHA}" -o direct-source.html
          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --virtual-time-budget=20000 --dump-dom \
            "https://designmythinking.xyz/musings/read-less-hear-more/?diag=${GITHUB_SHA}" > direct-rendered.html 2>chrome-stderr.txt || true
          echo '--- source status/size ---'
          wc -c direct-source.html || true
          head -30 direct-headers.txt || true
          echo '--- rendered size ---'
          wc -c direct-rendered.html || true
          echo '--- markers ---'
          for marker in 'How the podcast works' 'roughly 450-page PDF' 'data-m07-demo' 'Read less. Hear more.' 'This page did not load as expected' 'musing07.js'; do
            if grep -q "$marker" direct-rendered.html; then echo "FOUND: $marker"; else echo "MISSING: $marker"; fi
          done
          grep -n -E 'Read less|podcast works|did not load|musing07|serviceModalContent' direct-rendered.html | head -80 || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: musing07-route-diagnostic
          path: |
            direct-source.html
            direct-rendered.html
            direct-headers.txt
            chrome-stderr.txt
          retention-days: 2
